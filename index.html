<!DOCTYPE html>
<html lang="es">






<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/APPAVPCEA/manifest.json">
  <link rel="stylesheet" href="/APPAVPCEA/styles.css">
  <link rel="apple-touch-icon" href="/APPAVPCEA/icons/icon-192.png">
  <link rel="apple-touch-startup-image" href="/APPAVPCEA/icons/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0d6efd">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APP AVPCEA</title>



  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    const supabase = supabase.createClient(
      "https://hptnaoliiychgkxsaksy.supabase.co",
      "sb_publishable_yr41XhMZMxDXwyuJZRolVw_6o05FP8a"
    );
  </script>
</head>






<body>

  <!-- INICIO TOKEN DE AUTORIZACIÓN -->
  <script>
    const TOKEN_SECRETO = "v3";
    const tokenGuardado = localStorage.getItem("avpcea_token");

    window.AVPCEA_AUTORIZADO = false;

    if (tokenGuardado === TOKEN_SECRETO) {
      window.AVPCEA_AUTORIZADO = true;
    } else {
      const codigo = prompt("Introduce el código de autorización:");
      if (codigo === TOKEN_SECRETO) {
        localStorage.setItem("avpcea_token", TOKEN_SECRETO);
        alert("Dispositivo autorizado.");
        window.AVPCEA_AUTORIZADO = true;
      } else {
        window.AVPCEA_AUTORIZADO = false;
      }
    }
  </script>
  <!-- FIN TOKEN DE AUTORIZACIÓN -->



  <!-- AVISO DE NUEVA VERSIÓN -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/APPAVPCEA/service-worker.js").then(reg => {
        reg.onupdatefound = () => {
          const newWorker = reg.installing;
          newWorker.onstatechange = () => {
            if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
              alert("Nueva versión disponible. Recarga la app.");
            }
          };
        };
      });
    }
  </script>
  <!-- FIN AVISO DE NUEVA VERSIÓN -->



  <!-- INICIO APP COMPLETA -->
  <div id="app-container" class="app-container" style="display:none;">


  
    <!-- PANTALLA DE BIENVENIDA -->
    <div id="welcome-screen" class="screen active">
      <header id="welcome-header" class="welcome-header">
        <img src="/APPAVPCEA/icons/icon-512.png" class="welcome-hero">
      </header>

      <div class="card welcome-card">
        <button id="btn-acceder" class="btn-primary">Acceder</button>
      </div>
    </div>
    <!-- FIN PANTALLA DE BIENVENIDA -->



    <!-- CABECERA NORMAL -->
    <header id="main-header" class="app-header" style="display:none;">
      <img src="/APPAVPCEA/icons/icon-192.png" class="header-logo">
      <span class="header-title">Protección Civil El Arenal</span>
    </header>
    <!-- CABECERA NORMAL -->



    <!-- CONTENIDO PRINCIPAL -->
    <main class="app-content">



      <!-- PANTALLAS DE LA APP -->
      <div id="app-screens" style="display:none;">

        <div id="screen-operativos" class="screen">
          <h2 class="section-title">Operativos</h2>
          <div id="lista-operativos"></div>
        </div>

        <div id="screen-preventivos" class="screen">
          <h2 class="section-title">Preventivos</h2>
          <div id="lista-preventivos"></div>
        </div>

        <div id="screen-emergencias" class="screen">
          <h2 class="section-title">Emergencias</h2>
          <div id="lista-emergencias"></div>
        </div>

      </div>
      <!-- FIN PANTALLAS DE LA APP -->



    </main>
    <!-- FIN CONTENIDO PRINCIPAL -->



    <!-- BARRA INFERIOR -->
    <nav class="bottom-nav" style="display:none;">
      <button class="nav-btn active" data-screen="operativos">Operativos</button>
      <button class="nav-btn" data-screen="preventivos">Preventivos</button>
      <button class="nav-btn" data-screen="emergencias">Emergencias</button>
    </nav>
    <!-- BARRA INFERIOR -->



  </div>
  <!-- FIN APP COMPLETA -->



  <!-- SCRIPTS DE CARGA PREVENTIVOS-->
  <script>
    async function cargarPreventivos() {
      const cont = document.getElementById("lista-preventivos");
      cont.innerHTML = "<p>Cargando preventivos...</p>";

      const { data: preventivos, error } = await supabase
        .from("preventivos")
        .select("*")
        .order("fecha", { ascending: true });

      if (error) {
        cont.innerHTML = "<p>Error al cargar preventivos.</p>";
        return;
      }

      cont.innerHTML = "";

      for (const p of preventivos) {
        const suscrito = await estaSuscrito("NRP", p.id);

        cont.innerHTML += `
          <div class="card">
            <h3>${p.titulo}</h3>
            <p><strong>Fecha:</strong> ${p.fecha}</p>
            <p><strong>Lugar:</strong> ${p.lugar}</p>
            <p>${p.descripcion || ""}</p>

            <button class="btn-primary" onclick="toggleSuscripcion('NRP', ${p.id})">
              ${suscrito ? "Cancelar suscripción" : "Suscribirme"}
            </button>
          </div>
        `;
      }
    }
  </script>
  <!-- FIN SCRIPTS DE CARGA PREVENTIVOS-->



  <!-- SCRIPTS DE CARGA OPERATIVOS-->
  <script>
    async function cargarOperativos() {
      const cont = document.getElementById("lista-operativos");
      cont.innerHTML = "<p>Cargando operativos...</p>";

      const { data: operativos, error } = await supabase
        .from("operativos")
        .select("*")
        .order("fecha", { ascending: true });

      if (error) {
        cont.innerHTML = "<p>Error al cargar operativos.</p>";
        return;
      }

      cont.innerHTML = "";

      for (const op of operativos) {
        const suscrito = await estaSuscrito("OPR", op.id);

        cont.innerHTML += `
          <div class="card">
            <h3>${op.titulo}</h3>
            <p><strong>Entidad:</strong> ${op.entidad || "—"}</p>
            <p><strong>Fecha:</strong> ${op.fecha}</p>
            <p>${op.descripcion || ""}</p>

            <button class="btn-primary" onclick="toggleSuscripcion('OPR', ${op.id})">
              ${suscrito ? "Cancelar suscripción" : "Suscribirme"}
            </button>
          </div>
        `;
      }
    }
  </script>
  <!-- FIN SCRIPTS DE CARGA OPERATIVOS-->



  <!-- SCRIPTS DE CARGA EMERGENCIAS-->
  <script>
    async function cargarEmergencias() {
      const cont = document.getElementById("lista-emergencias");

      cont.innerHTML = `
        <div class="card">
          <h3>Sin emergencias activas</h3>
          <p>Actualmente no hay emergencias registradas.</p>
          <p>Cuando se active una emergencia, aparecerá aquí automáticamente.</p>
        </div>
      `;
    }
  </script>
  <!-- FIN SCRIPTS DE CARGA EMERGENCIAS-->



  <!-- SUSCRIPCIONES -->
  <script>
    async function estaSuscrito(tipo, evento_id) {
      const usuario_id = localStorage.getItem("usuario_id");

      const { data } = await supabase
        .from("suscripciones")
        .select("*")
        .eq("usuario_id", usuario_id)
        .eq("tipo", tipo)
        .eq("evento_id", evento_id)
        .maybeSingle();

      return data ? true : false;
    }
  </script>
  <!-- FIN SUSCRIPCIONES -->



  <!-- AÑADIR SUSCRIPCIONES OPERATIVOS/PREVENTIVOS -->
  <script>
    async function toggleSuscripcion(tipo, evento_id) {
      const usuario_id = localStorage.getItem("usuario_id");
      const suscrito = await estaSuscrito(tipo, evento_id);

      if (!suscrito) {
        await supabase.from("suscripciones").insert([{ usuario_id, tipo, evento_id }]);
        alert("Suscripción realizada.");
      } else {
        await supabase
          .from("suscripciones")
          .delete()
          .eq("usuario_id", usuario_id)
          .eq("tipo", tipo)
          .eq("evento_id", evento_id);
        alert("Suscripción cancelada.");
      }

      if (tipo === "NRP") cargarPreventivos();
      if (tipo === "OPR") cargarOperativos();
    }
  </script>
  <!-- AÑADIR SUSCRIPCIONES OPERATIVOS/PREVENTIVOS -->



  <!-- AÑADIR SUSCRIPCIONES EMERGENCIAS -->
  <script>
    async function toggleSuscripcionEmergencia(evento_id) {
      const usuario_id = localStorage.getItem("usuario_id");

      const { data: suscrito } = await supabase
        .from("suscripciones")
        .select("*")
        .eq("usuario_id", usuario_id)
        .eq("tipo", "EMG")
        .eq("evento_id", evento_id)
        .maybeSingle();

      if (!suscrito) {
        await supabase.from("suscripciones").insert([{ usuario_id, tipo: "EMG", evento_id }]);
        alert("Suscripción a emergencia realizada.");
      } else {
        await supabase
          .from("suscripciones")
          .delete()
          .eq("usuario_id", usuario_id)
          .eq("tipo", "EMG")
          .eq("evento_id", evento_id);
        alert("Suscripción cancelada.");
      }

      cargarEmergencias();
    }
  </script>
  <!-- FIN AÑADIR SUSCRIPCIONES EMERGENCIAS -->



  <!-- CONTROL DE NAVEGACION SPA -->
  <script>
    function showScreen(name) {
      if (name === "preventivos") cargarPreventivos();
      if (name === "operativos") cargarOperativos();
      if (name === "emergencias") cargarEmergencias();

      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      document.querySelector(`.nav-btn[data-screen="${name}"]`).classList.add("active");

      document.querySelectorAll("#app-screens .screen").forEach(s => s.classList.remove("active"));
      document.getElementById("screen-" + name).classList.add("active");
    }
  </script>
  <!-- FIN CONTROL DE NAVEGACION SPA -->



<script>
  async function probarConexion() {
    alert("🔵 Ejecutando prueba de conexión…");

    try {
      const { data, error } = await supabase
        .from("operativos")
        .select("*")
        .limit(1);

      if (error) {
        alert("❌ Error Supabase: " + JSON.stringify(error));
        console.error(error);
        return;
      }

      alert("✅ Conexión correcta. Resultado: " + JSON.stringify(data));
      console.log("Resultado:", data);

    } catch (e) {
      alert("🔥 Error inesperado: " + e.message);
      console.error(e);
    }
  }

  probarConexion();
</script>



  <!-- INICIO DE LA APP COMPLETA-->
  <SCRIPT>
    document.addEventListener("DOMContentLoaded", () => {

      if (!window.AVPCEA_AUTORIZADO) {
        document.body.innerHTML = `
          <div style="padding:20px; text-align:center;">
            <h2>Acceso no autorizado</h2>
            <p>Este dispositivo no está autorizado para usar la APP AVPCEA.</p>
          </div>
        `;
        return;
      }

      if (!localStorage.getItem("usuario_id")) {
        localStorage.setItem("usuario_id", crypto.randomUUID());
      }

      document.getElementById("app-container").style.display = "block";

      showScreen("operativos");   // ← CARGA OPERATIVOS AUTOMÁTICAMENTE

      // BOTÓN ACCEDER
      document.getElementById("btn-acceder").addEventListener("click", () => {
        document.getElementById("welcome-screen").style.display = "none";
        document.getElementById("welcome-header").style.display = "none";

        document.getElementById("app-screens").style.display = "block";
        document.getElementById("main-header").style.display = "flex";
        document.querySelector(".bottom-nav").style.display = "flex";

        showScreen("operativos");
      });

      // BOTONES DE NAVEGACIÓN
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          showScreen(btn.dataset.screen);
        });
      });

    });
  </script>
  <!-- FIN DE LA APP COMPLETA -->



<script>
  alert("¿Existe Supabase?: " + (typeof supabase));
</script>



</body>
</html>

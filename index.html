<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVPCEA - Protección Civil El Arenal</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- CONTENEDOR PRINCIPAL MÓVIL CENTRADO (480px) -->
  <div class="app-container">
    
    <!-- CABECERA FIJA ÁMBAR -->
    <header class="app-header">
      <img src="icons/icon-192.png" alt="Logo AVPCEA" class="header-logo">
      <h1 class="header-title">Protección Civil de El Arenal</h1>
    </header>

    <!-- CONTENIDO DINÁMICO DE LA APLICACIÓN -->
    <main class="app-content">

      <!-- 1. PANTALLA: EMERGENCIAS (Visible por defecto) -->
      <section id="emergencias" class="app-screen">
        <!-- El contenido se genera dinámicamente desde JS -->
      </section>

      <!-- 2. PANTALLA: SERVICIOS UNIFICADOS (OPR + NRP) -->
      <section id="servicios" class="app-screen" style="display: none;">
        <!-- Filtros rápidos opcionales y listado unificado generado desde JS -->
      </section>

      <!-- 3. PANTALLA: PERFIL -->
      <section id="perfil" class="app-screen" style="display: none;">
        <div class="card">
          <h3>Ficha de Voluntario</h3>
          <div id="perfil-datos">
            <p><strong>Nombre:</strong> <span id="voluntario-nombre">Conectando con Supabase...</span></p>
            <p><strong>Teléfono:</strong> <span id="voluntario-telefono">-</span></p>
            <p><strong>Horas Acumuladas:</strong> <span id="voluntario-horas">0</span>h</p>
          </div>
        </div>
      </section>

      <!-- 4. PANTALLA: ADMINISTRACIÓN -->
      <section id="admin" class="app-screen" style="display: none;">
        <h2 style="text-align: center; margin-bottom: 15px;">Panel de Administración</h2>
        
        <!-- Formulario Unificado Servicios (Operativos y Preventivos) -->
        <div class="card" id="card-form-servicio" style="border-top: 4px solid #ff6600;">
          <h3>Crear Nuevo Servicio</h3>
          
          <div class="form-group">
            <label for="srv-tipo">Tipo de Servicio:</label>
            <select id="srv-tipo" onchange="this.closest('.card').style.borderTopColor = this.value === 'OPR' ? '#ff6600' : '#007bff'">
              <option value="OPR">Operativo (OPR)</option>
              <option value="NRP">Preventivo (NRP)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="srv-titulo">Título:</label>
            <input type="text" id="srv-titulo" placeholder="Ej: Incendio Forestal / Carrera Ciclista" required>
          </div>
          
          <div class="form-group">
            <label for="srv-lugar">Lugar:</label>
            <input type="text" id="srv-lugar" placeholder="Ej: Zona Norte / Plaza Mayor">
          </div>

          <div class="form-group">
            <label for="srv-fecha">Fecha:</label>
            <input type="date" id="srv-fecha" name="fecha" required>
          </div>

          <div class="form-group">
            <label for="srv-inicio">Fecha y Hora de Inicio:</label>
            <input type="datetime-local" id="srv-inicio" required>
          </div>
          
          <div class="form-group-block">
            <label for="srv-descripcion">Descripción / Observaciones:</label>
            <textarea id="srv-descripcion" placeholder="Escribe los detalles del servicio aquí..."></textarea>
          </div>
          
          <button class="btn" id="btn-crear-servicio" style="background-color: #28a745; color: white;">Publicar Servicio</button>
        </div>

        <!-- Formulario Emergencias -->
        <div class="card" style="border-top: 4px solid #dc3545;">
          <h3>Crear Alerta de Emergencia</h3>
          
          <div class="form-group">
            <label>Alerta:</label>
            <input type="text" id="em-titulo" placeholder="Ej: Inundación Vía Pública" required>
          </div>
          
          <div class="form-group">
            <label>Gravedad:</label>
            <select id="em-nivel">
              <option value="bajo">Bajo</option>
              <option value="medio" selected>Medio</option>
              <option value="alto">Alto</option>
              <option value="critico">Crítico</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Fecha y Hora de Inicio:</label>
            <input type="datetime-local" id="em-inicio" required>
          </div>
          
          <button class="btn btn-danger" id="btn-crear-emergencia" style="background-color: #dc3545; color: white;">🚨 Publicar Emergencia Activa</button>
        </div>

        <!-- Contenedor para listado administrativo unificado -->
        <div id="admin-listado-unificado"></div>
      </section>

    </main>

    <!-- BARRA DE NAVEGACIÓN INFERIOR (BOTTOM-NAV) -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-screen="emergencias">Emergencias</button>
      <button class="nav-btn" data-screen="servicios">Servicios</button>
      <button class="nav-btn" data-screen="perfil">Perfil</button>
      <button class="nav-btn" data-screen="admin">Admin</button>
    </nav>

  </div>

<!-- CDN Oficial y Estable de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Tu script central modular -->
<script type="module" src="js/app.js"></script>

</body>
</html>

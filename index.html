<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP AVPCEA</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body style="display: block !important; background: #ffffff !important;">

    <!-- El contenedor principal arranca visible por defecto -->
    <div id="app-container" class="app-container" style="display: block !important; visibility: visible !important; opacity: 1 !important;">
        
        <!-- El contenedor interno también se fuerza de forma nativa a modo bloque -->
        <main class="app-content" style="display: block !important; visibility: visible !important; height: auto !important; min-height: 100vh !important;">
            
            <header>
                <h1>Protección Civil El Arenal</h1>
                <p>Panel de Control Local</p>
            </header>

            <!-- Sección de Administración visible por defecto -->
            <section id="administracion" style="display: block !important; visibility: visible !important;">
                <h2>Administración</h2>
                
                <div class="card">
                    <h3>Crear Operativo</h3>
                    <label>Fecha y Hora de Inicio:</label>
                    <input type="datetime-local">
                    <button>Crear Operativo</button>
                </div>

                <div class="card">
                    <h3>Crear Preventivo</h3>
                    <label>Fecha y Hora de Inicio:</label>
                    <input type="datetime-local">
                    <button>Crear Preventivo</button>
                </div>

                <div class="card">
                    <h3>Crear Emergencia</h3>
                    <label>Nivel de Gravedad:</label>
                    <select>
                        <option>Bajo</option>
                        <option>Medio</option>
                        <option>Alto</option>
                        <option>Crítico</option>
                    </select>
                    <label>Fecha y Hora de Inicio:</label>
                    <input type="datetime-local">
                    <button>Crear Emergencia</button>
                </div>

                <div class="card">
                    <h3>Crear Usuario</h3>
                    <label>Fecha de Nacimiento:</label>
                    <input type="date">
                    <label>Rol del Dispositivo:</label>
                    <select>
                        <option>Usuario</option>
                        <option>Administrador</option>
                        <option>Coordinador</option>
                    </select>
                    <button>Crear Usuario</button>
                </div>

                <div class="card">
                    <h3>Gestión de Usuarios</h3>
                    <button>🔄 Actualizar usuarios</button>
                </div>
            </section>

            <!-- Ficha de Voluntario (Estructura base lista para recibir los datos) -->
            <section id="ficha-voluntario" style="display: block !important; visibility: visible !important; margin-top: 30px;">
                <h2>Ficha de Voluntario</h2>
                <div id="datos-voluntario">
                    <p>Cargando información del perfil...</p>
                </div>
            </section>

        </main>

        <!-- Barra de navegación inferior nativa visible -->
        <nav class="app-navigation" style="display: block !important; visibility: visible !important;">
            <button class="nav-btn">Operativos</button>
            <button class="nav-btn">Preventivos</button>
            <button class="nav-btn">Emergencias</button>
            <button class="nav-btn active">Administración</button>
        </nav>
    </div>

    <!-- Tu archivo de JavaScript local en formato nativo limpio -->
    <script defer src="app.js"></script>
</body>
</html>

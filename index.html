<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/APPAVPCEA/manifest.json">
  <link rel="stylesheet" href="/APPAVPCEA/styles.css">
  <link rel="apple-touch-icon" href="/APPAVPCEA/icons/icon-192.png">
  <link rel="apple-touch-startup-image" href="/APPAVPCEA/icons/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0d6efd">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Web App</title>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      </h1>APP AVPCEA</h1>
    </header>

    <main class="app-content">
      <div class="card">
        <h2>Bienvenido</h2>
        <p>Esta es la aplicación oficial AVPCEA.</p>
        <button class="btn-primary">Acceder</button>
      </div>

      <div class="card">
        <h2>Noticias</h2>
        <p>Consulta las últimas novedades.</p>
        <button class="btn-secondary">Ver más</button>
      </div>

      <div id="screen-inicio" class="screen active">
        <div class="card">
          <h2>Bienvenido</h2>
          <p>Esta es la pantalla de inicio.</p>
        </div>
      </div>

      <div id="screen-noticias" class="screen">
        <div class="card">
          <h2>Noticias</h2>
          <p>Aquí aparecerán las novedades.</p>
        </div>
      </div>

      <div id="screen-perfil" class="screen">
        <div class="card">
          <h2>Perfil</h2>
          <p>Información del usuario.</p>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-screen="inicio">Inicio</button>
      <button class="nav-btn" data-screen="noticias">Noticias</button>
      <button class="nav-btn" data-screen="perfil">Perfil</button>
    </nav>

  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/APPAVPCEA/service-worker.js");
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/APPAVPCEA/service-worker.js").then(reg => {
      reg.onupdatefound = () => {
        const newWorker = reg.installing;
          newWorker.onstatechange = () => {
          if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
            alert("Nueva versión disponible. Recarga la app.");
            }
          };
        };
      });
    }
  </script>

  <script>
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {

        // Quitar active de todos los botones
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        // Ocultar todas las pantallas
        document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));

        // Mostrar la pantalla seleccionada
        const screenId = "screen-" + btn.dataset.screen;
        document.getElementById(screenId).classList.add("active");
      });
    });
  </script>
  
</body>
</html>

  <script>
    async function cargarPreventivos() {
      const cont = document.getElementById("lista-preventivos");
      cont.innerHTML = "<p>Cargando preventivos...</p>";

      const { data: preventivos, error } = await supabase
        .from("preventivos")
        .select("*")
        .order("fecha", { ascending: true });

      if (error) {
        cont.innerHTML = "<p>Error al cargar preventivos.</p>";
        return;
      }

      cont.innerHTML = "";

      for (const p of preventivos) {
        const suscrito = await estaSuscrito("NRP", p.id);

        cont.innerHTML += `
          <div class="card">
            <h3>${p.titulo}</h3>
            <p><strong>Fecha:</strong> ${p.fecha}</p>
            <p><strong>Lugar:</strong> ${p.lugar}</p>
            <p>${p.descripcion || ""}</p>

            <button class="btn-primary" onclick="toggleSuscripcion('NRP', ${p.id})">
              ${suscrito ? "Cancelar suscripción" : "Suscribirme"}
            </button>
          </div>
        `;
      }
    }

        .from("operativos")
        .select("*")
        .order("fecha", { ascending: true });

      if (error) {

        return;

      cont.innerHTML = "";

      for (const op of operativos) {
        const suscrito = await estaSuscrito("OPR", op.id);

        cont.innerHTML += `
          <div class="card">
            <h3>${op.titulo}</h3>
            <p><strong>Entidad:</strong> ${op.entidad || "—"}</p>
            <p><strong>Fecha:</strong> ${op.fecha}</p>
            <p>${op.descripcion || ""}</p>

            <button class="btn-primary" onclick="toggleSuscripcion('OPR', ${op.id})">
              ${suscrito ? "Cancelar suscripción" : "Suscribirme"}
            </button>
          </div>
        `;
      }
    }

  <script>
    async function estaSuscrito(tipo, evento_id) {
      const usuario_id = localStorage.getItem("usuario_id");

      const { data } = await supabase
        .from("suscripciones")
        .select("*")
        .eq("usuario_id", usuario_id)
        .eq("tipo", tipo)
        .eq("evento_id", evento_id)
        .maybeSingle();

      return data ? true : false;
    }

    // =============================== 
    //  ADMINISTRACIÓN SUSCRIPCIONES  
    // =============================== 
    async function toggleSuscripcion(tipo, evento_id) {
      const usuario_id = localStorage.getItem("usuario_id");
      const suscrito = await estaSuscrito(tipo, evento_id);

      const tabla = tipo === "NRP" ? "preventivos" :
                    tipo === "OPR" ? "operativos" :
                    tipo === "EMG" ? "emergencias" : null;

      if (!tabla) {
        alert("Tipo de evento desconocido.");
        return;
      }

      if (!suscrito) {
        await supabase.from("suscripciones").insert([
          { usuario_id, tipo, evento_id: String(evento_id) }
        ]);

        const { data: evento } = await supabase
          .from(tabla)
          .select("duracion_horas")
          .eq("id", evento_id)
          .maybeSingle();

        const horas = evento?.duracion_horas || 0;
        const año = new Date().getFullYear();

        await supabase.from("horas").insert([
          {
            usuario_id,
            evento_id: String(evento_id),
            tipo,
            horas,
            año
          }
        ]);

        alert("Suscripción realizada.");
      } else {
        await supabase
          .from("suscripciones")
          .delete()
          .eq("usuario_id", usuario_id)
          .eq("tipo", tipo)
          .eq("evento_id", String(evento_id));

        await supabase
          .from("horas")
          .delete()
          .eq("usuario_id", usuario_id)
          .eq("evento_id", String(evento_id))
          .eq("tipo", tipo);

        alert("Suscripción cancelada.");
      }

      if (tipo === "NRP") cargarPreventivos();
      if (tipo === "OPR") cargarOperativos();
      if (tipo === "EMG") cargarEmergencias();
    }

    // =============================== 
    //  ADMINISTRACIÓN CERRAR EVENTO  
    // =============================== 
    async function cerrarEvento(tabla, evento_id, fecha_fin) {
      const { data: evento } = await supabaseAdmin
        .from(tabla)
        .select("fecha_inicio")
        .eq("id", evento_id)
        .maybeSingle();

      const inicio = new Date(evento.fecha_inicio);
      const fin = new Date(fecha_fin);

      const duracion_horas = (fin - inicio) / (1000 * 60 * 60);

      await supabaseAdmin
        .from(tabla)
        .update({
          fecha_fin,
          duracion_horas
        })
        .eq("id", evento_id);

      const { data: suscritos } = await supabaseAdmin
        .from("suscripciones")
        .select("usuario_id, tipo")
        .eq("evento_id", String(evento_id));

      const año = new Date().getFullYear();

      for (const s of suscritos) {
        await supabaseAdmin
          .from("horas")
          .update({ horas: duracion_horas })
          .eq("usuario_id", s.usuario_id)
          .eq("evento_id", String(evento_id))
          .eq("tipo", s.tipo)
          .eq("año", año);
      }

      alert("Evento cerrado y horas recalculadas.");
    }
  </script>

      const { data } = await supabase
        .from("dispositivos")
        .select("*")
        .eq("id", usuario_id)
        .maybeSingle();

      if (!data) {
        await supabase.from("dispositivos").insert([
          { id: usuario_id, rol: "normal" }
        ]);
      }
    }

    async function esAdmin() {
      const usuario_id = localStorage.getItem("usuario_id");

      const { data } = await supabase
        .from("dispositivos")
        .select("rol")
        .eq("id", usuario_id)
        .maybeSingle();

      return data && data.rol === "admin";
    }
  </script>

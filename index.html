<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/APPAVPCEA/manifest.json">
  <link rel="stylesheet" href="/APPAVPCEA/styles.css">
  <link rel="apple-touch-icon" href="/APPAVPCEA/icons/icon-192.png">
  <link rel="apple-touch-startup-image" href="/APPAVPCEA/icons/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0d6efd">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Web App</title>
</head>
<body>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/APPAVPCEA/service-worker.js");
    }
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/APPAVPCEA/service-worker.js").then(reg => {
      reg.onupdatefound = () => {
        const newWorker = reg.installing;
          newWorker.onstatechange = () => {
          if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
            alert("Nueva versión disponible. Recarga la app.");
            }
          };
        };
      });
    }
  </script>

  <div class="app-container">
    <header class="app-header">
      </h1>APP AVPCEA</h1>
    </header>

    <main class="app-content">
      <div class="card">
        <h2>Bienvenido</h2>
        <p>Esta es la aplicación oficial AVPCEA.</p>
        <button class="btn-primary">Acceder</button>
      </div>

      <div class="card">
        <h2>Noticias</h2>
        <p>Consulta las últimas novedades.</p>
        <button class="btn-secondary">Ver más</button>
      </div>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active">Inicio</button>
      <button class="nav-btn">Noticias</button>
      <button class="nav-btn">Perfil</button>
    </nav>

  </div>


  
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/APPAVPCEA/manifest.json">
  <link rel="stylesheet" href="/APPAVPCEA/styles.css">
  <link rel="apple-touch-icon" href="/APPAVPCEA/icons/icon-192.png">
  <link rel="apple-touch-startup-image" href="/APPAVPCEA/icons/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0d6efd">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Web App</title>
</head>
<body>


  <script>
    // TOKEN QUE SOLO TÚ CONOCES
    const TOKEN_SECRETO = "AVPCEA-1996-ACCESS";

    // Comprobar si el dispositivo ya está autorizado
    const tokenGuardado = localStorage.getItem("avpcea_token");

    // Si NO está autorizado, pedir autorización
    if (tokenGuardado !== TOKEN_SECRETO) {
        const codigo = prompt("Introduce el código de autorización:");

        if (codigo === TOKEN_SECRETO) {
          // Guardar token en el dispositivo
          localStorage.setItem("avpcea_token", TOKEN_SECRETO);
          alert("Dispositivo autorizado.");
        } else {
          // Bloquear acceso
          document.body.innerHTML = `
              <div style="padding:20px; text-align:center;">
                  <h2>Acceso no autorizado</h2>
                  <p>Este dispositivo no está autorizado para usar la APP AVPCEA.</p>
              </div>
          `;
          throw new Error("Acceso bloqueado");
        }
    }
  </script>


  <!--
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/APPAVPCEA/service-worker.js");
    }
  </script>
  //-->

  <script>
    // AVISO USUARIO NUEVA VERSION
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/APPAVPCEA/service-worker.js").then(reg => {
      reg.onupdatefound = () => {
        const newWorker = reg.installing;
          newWorker.onstatechange = () => {
          if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
            alert("Nueva versión disponible. Recarga la app.");
            }
          };
        };
      });
    }
  </script>

  <script>
    // SCRIPT DE NAVEGACION
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {

        // Quitar active de todos los botones
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        // Ocultar todas las pantallas
        document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));

        // Mostrar la pantalla seleccionada
        const screenId = "screen-" + btn.dataset.screen;
        document.getElementById(screenId).classList.add("active");
      });
    });
  </script>

  <script>
    // BOTON DE BIENVENIDA Y NAVEGACION
    function showScreen(name) {
      // Desactivar botones
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      document.querySelector(`.nav-btn[data-screen="${name}"]`).classList.add("active");

      // Ocultar pantallas
      document.querySelectorAll("#app-screens .screen").forEach(s => s.classList.remove("active"));

      // Mostrar pantalla seleccionada
      document.getElementById("screen-" + name).classList.add("active");
    }

      // Evento del botón ACCEDER
      document.getElementById("btn-acceder").addEventListener("click", () => {
      // Ocultar bienvenida
      document.getElementById("welcome-screen").style.display = "none";

      // Mostrar estructura de pantallas
      document.getElementById("app-screens").style.display = "block";

      // Mostrar barra inferior
      document.querySelector(".bottom-nav").style.display = "flex";

      // Iniciar en la pantalla de inicio
      showScreen("inicio");
    });

      // Navegación inferior
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
        showScreen(btn.dataset.screen);
    });
  });
</script>



  <div class="app-container">

    <header class="app-header">
      </h1>APP AVPCEA</h1>
    </header>

    <header id="welcome-header" class="welcome-header">
      <img src="/APPAVPCEA/icons/icon-512.png" class="welcome-logo">
    </header>


    <main class="app-content">
      <!-- PANTALLA DE BIENVENIDA -->
      <div id="welcome-screen" class="screen active">
        <div class="card">
          <h2>Bienvenido</h2>
          <p>Esta es la aplicación oficial AVPCEA.</p>
          <button id="btn-acceder" class="btn-primary">Acceder</button>
        </div>
      </div>
      
      <!-- PANTALLAS DE LA APP -->
      <div id="app-screens" style="display:none;">

        <div id="screen-inicio" class="screen">
          <div class="card">
            <h2>Inicio</h2>
            <p>Pantalla principal.</p>
          </div>
        </div>
        
        <div id="screen-noticias" class="screen">
          <div class="card">
            <h2>Noticias</h2>
            <p>Aquí aparecerán las novedades.</p>
          </div>
        </div>

        <div id="screen-perfil" class="screen">
          <div class="card">
            <h2>Perfil</h2>
            <p>Información del usuario.</p>
          </div>
        </div>

      </div>
    
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-screen="inicio">Inicio</button>
      <button class="nav-btn" data-screen="noticias">Noticias</button>
      <button class="nav-btn" data-screen="perfil">Perfil</button>
    </nav>

  </div>

  
</body>
</html>

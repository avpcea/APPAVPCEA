<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AVPCEA</title>

  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Estilos -->
  <link rel="stylesheet" href="styles.css">

  <!-- Evita caché agresiva en GitHub Pages -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>

<body>

  <!-- =============================== -->
  <!-- PANTALLA DE BIENVENIDA -->
  <!-- =============================== -->
  <header id="welcome-header" class="welcome-header">
    <h1>AVPCEA</h1>
  </header>

  <section id="welcome-screen" class="welcome-screen">
    <p>Bienvenido a la aplicación AVPCEA.</p>
    <button id="btn-acceder" class="btn-primary">Acceder</button>
  </section>


  <!-- =============================== -->
  <!-- CONTENEDOR PRINCIPAL DE LA APP -->
  <!-- =============================== -->
  <div id="app-container" class="app-container" style="display:none;">

    <!-- HEADER PRINCIPAL -->
    <header id="main-header" class="main-header" style="display:none;">
      <h2 class="header-title">Operativos</h2>
    </header>

    <!-- =============================== -->
    <!-- PANTALLAS DE LA APP (SPA) -->
    <!-- =============================== -->
    <section id="app-screens" style="display:none;">

      <!-- OPERATIVOS -->
      <div id="screen-operativos" class="screen active">
        <div id="lista-operativos"></div>
      </div>

      <!-- PREVENTIVOS -->
      <div id="screen-preventivos" class="screen">
        <div id="lista-preventivos"></div>
      </div>

      <!-- EMERGENCIAS -->
      <div id="screen-emergencias" class="screen">
        <div id="lista-emergencias"></div>
      </div>

      <!-- ADMIN -->
      <div id="screen-admin" class="screen">
        <div id="admin-screen" style="display:none;">
          <h3>Panel de Administración</h3>
          <div id="admin-listado"></div>
          <div id="admin-usuarios"></div>
        </div>
      </div>

    </section>


    <!-- =============================== -->
    <!-- NAVEGACIÓN INFERIOR -->
    <!-- =============================== -->
    <nav class="bottom-nav" style="display:none;">
      <button class="nav-btn active" data-screen="operativos">Operativos</button>
      <button class="nav-btn" data-screen="preventivos">Preventivos</button>
      <button class="nav-btn" data-screen="emergencias">Emergencias</button>
      <button id="admin-btn" class="nav-btn" data-screen="admin" style="display:none;">Admin</button>
    </nav>

  </div>


  <!-- =============================== -->
  <!-- SCRIPT PRINCIPAL (OPTIMIZADO) -->
  <!-- =============================== -->
  <script type="module" src="app.js" defer></script>

</body>
</html>

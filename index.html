<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP AVPCEA</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Contenedor móvil centrado oficial -->
    <div class="app-container">
        
        <!-- Cabecera Normal con el color Naranja corporativo e icono oficial -->
        <header class="app-header">
            <!-- Cargamos tu icono oficial con la ruta correspondiente -->
            <img class="header-logo" src="icons/icon-192.png" alt="Logo Protección Civil" onerror="this.src='./icons/icon-192.png';">
            <span class="header-title">AVPCEA</span>
        </header>


        <!-- Contenido principal con scroll vertical independiente -->
        <main class="app-content">
            
            <!-- PANTALLA 1: FICHA DE VOLUNTARIO (Ahora sale la primera en solitario) -->
            <section id="inicio" class="screen active">
                <h2 class="section-title" style="display: block !important;">Mi Perfil</h2>
                <div class="card">
                    <h3>Ficha de Voluntario</h3>
                    <div id="datos-voluntario">
                        <p style="color: #666; font-style: italic; text-align: center; padding: 20px 0;">
                            Cargando información del perfil local...
                        </p>
                    </div>
                </div>
            </section>

            <!-- PANTALLA 2: PANEL DE ADMINISTRACIÓN (Oculto al inicio mediante la clase screen sin active) -->
            <section id="administracion" class="screen">
                <h2 class="section-title" style="display: block !important;">Panel de Administración</h2>
                
                <div class="card">
                    <h3>Crear Operativo</h3>
                    <div class="admin-section" style="background: none; padding: 0;">
                        <label>Fecha y Hora de Inicio:</label>
                        <input type="datetime-local">
                        <button class="btn-primary">Crear Operativo</button>
                    </div>
                </div>

                <div class="card">
                    <h3>Crear Preventivo</h3>
                    <div class="admin-section" style="background: none; padding: 0;">
                        <label>Fecha y Hora de Inicio:</label>
                        <input type="datetime-local">
                        <button class="btn-primary">Crear Preventivo</button>
                    </div>
                </div>

                <div class="card">
                    <h3>Crear Emergencia</h3>
                    <div class="admin-section" style="background: none; padding: 0;">
                        <label>Nivel de Gravedad:</label>
                        <select style="width: 100%; margin-bottom: 10px; padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
                            <option>Bajo</option>
                            <option>Medio</option>
                            <option>Alto</option>
                            <option>Crítico</option>
                        </select>
                        <label>Fecha y Hora de Inicio:</label>
                        <input type="datetime-local">
                        <button class="btn-primary" style="background-color: #d9534f !important; border-color: #d9534f !important;">Crear Emergencia</button>
                    </div>
                </div>

                <div class="card">
                    <h3>Crear Usuario</h3>
                    <div class="admin-section" style="background: none; padding: 0;">
                        <label>Fecha de Nacimiento:</label>
                        <input type="date">
                        <label>Rol del Dispositivo:</label>
                        <select style="width: 100%; margin-bottom: 10px; padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
                            <option>Usuario</option>
                            <option>Administrador</option>
                            <option>Coordinador</option>
                        </select>
                        <button class="btn-primary">Crear Usuario</button>
                    </div>
                </div>

                <div class="card">
                    <h3>Gestión de Usuarios</h3>
                    <button class="btn-secondary">🔄 Actualizar usuarios</button>
                </div>
            </section>

        </main>

        <!-- Barra inferior de navegación nativa fija posicionada según tus estilos -->
        <nav class="bottom-nav">
            <button class="nav-btn active">Operativos</button>
            <button class="nav-btn">Preventivos</button>
            <button class="nav-btn">Emergencias</button>
            <button class="nav-btn">Administración</button>
        </nav>
    </div>

    <!-- Tu archivo de JavaScript local en formato de módulo -->
    <script type="module" src="app.js"></script>
</body>
</html>

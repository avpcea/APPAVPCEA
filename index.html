<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APP AVPCEA</title>

  <link rel="manifest" href="/APPAVPCEA/manifest.json">
  <link rel="stylesheet" href="/APPAVPCEA/styles.css">
  <meta name="theme-color" content="#0d6efd">
</head>

<body>

  <div class="app-container">

    <header class="app-header">
      <h1>APP AVPCEA</h1>
    </header>

    <main class="app-content">

      <div class="card">
        <h2>Bienvenido</h2>
        <p>Esta es la aplicación oficial AVPCEA.</p>
        <button class="btn-primary">Acceder</button>
      </div>

      <div class="card">
        <h2>Noticias</h2>
        <p>Consulta las últimas novedades.</p>
        <button class="btn-secondary">Ver más</button>
      </div>

      <div id="screen-inicio" class="screen active">
        <div class="card">
          <h2>Bienvenido</h2>
          <p>Esta es la pantalla de inicio.</p>
      </div>
    </div>

    <div id="screen-noticias" class="screen">
      <div class="card">
        <h2>Noticias</h2>
        <p>Aquí aparecerán las novedades.</p>
      </div>
    </div>

    <div id="screen-perfil" class="screen">
      <div class="card">
        <h2>Perfil</h2>
        <p>Información del usuario.</p>
      </div>
    </div>


    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active">Inicio</button>
      <button class="nav-btn">Noticias</button>
      <button class="nav-btn">Perfil</button>
    </nav>

  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/APPAVPCEA/service-worker.js");
    }
  </script>

</body>
</html>

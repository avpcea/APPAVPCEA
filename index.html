<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVPCEA - Protección Civil El Arenal</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- CONTENEDOR PRINCIPAL MÓVIL CENTRADO (480px) -->
  <div class="app-container">
    
    <!-- CABECERA FIJA ÁMBAR -->
    <header class="app-header">
      <img src="icons/icon-192.png" alt="Logo AVPCEA" class="header-logo">
      <h1 class="header-title">Protección Civil de El Arenal</h1>
    </header>

    <!-- CONTENIDO DINÁMICO DE LA APLICACIÓN -->
    <main class="app-content">

      <!-- 1. PANTALLA: PERFIL (Visible por defecto) -->
      <section id="perfil" class="app-screen">
        <div class="card">
          <h3>Ficha de Voluntario</h3>
          <div id="perfil-datos">
            <p><strong>Nombre:</strong> <span id="voluntario-nombre">Conectando con Supabase...</span></p>
            <p><strong>Teléfono:</strong> <span id="voluntario-telefono">-</span></p>
            <p><strong>Horas Acumuladas:</strong> <span id="voluntario-horas">0</span>h</p>
          </div>
        </div>
      </section>

      <!-- 2. PANTALLA: OPERATIVOS (Oculta al inicio) -->
      <section id="operativos" class="app-screen" style="display: none;">
        <!-- El contenido se genera dinámicamente desde app.js -->
      </section>

      <!-- 3. PANTALLA: PREVENTIVOS (Oculta al inicio) -->
      <section id="preventivos" class="app-screen" style="display: none;">
        <!-- El contenido se genera dinámicamente desde app.js -->
      </section>

      <!-- 4. PANTALLA: EMERGENCIAS (Oculta al inicio) -->
      <section id="emergencias" class="app-screen" style="display: none;">
        <!-- El contenido se genera dinámicamente desde app.js -->
      </section>

      <!-- 5. PANTALLA: ADMINISTRACIÓN (Oculta al inicio) -->
      <section id="admin" class="app-screen" style="display: none;">
        <h2 style="text-align: center; margin-bottom: 15px;">Panel de Administración</h2>
        
        <!-- Formulario Operativos -->
        <div class="card" style="border-top: 4px solid #ff6600;">
          <h3>Crear Nuevo Operativo</h3>
          
          <div class="form-group">
            <label>Título:</label>
            <input type="text" id="op-titulo" placeholder="Ej: Incendio Forestal Nocturno" required>
          </div>
          
          <div class="form-group">
            <label>Lugar:</label>
            <input type="text" id="op-lugar" placeholder="Ej: Zona Norte">
          </div>
          
          <div class="form-group">
            <label>Fecha y Hora de Inicio:</label>
            <input type="datetime-local" id="op-inicio" required>
          </div>
          
          <div class="form-group-block">
            <label>Descripción / Observaciones:</label>
            <textarea id="op-descripcion" placeholder="Escribe los detalles del despliegue aquí..."></textarea>
          </div>
          
          <button class="btn" id="btn-crear-operativo" style="background-color: #ff6600; color: white;">Crear Operativo</button>
        </div>

        <!-- Formulario Preventivos -->
        <div class="card" style="border-top: 4px solid #007bff;">
          <h3>Crear Nuevo Preventivo</h3>
          
          <div class="form-group">
            <label>Título:</label>
            <input type="text" id="prev-titulo" placeholder="Ej: Carrera Ciclista" required>
          </div>
          
          <div class="form-group">
            <label>Lugar:</label>
            <input type="text" id="prev-lugar" placeholder="Ej: Plaza Mayor">
          </div>
          
          <div class="form-group">
            <label>Fecha y Hora de Inicio:</label>
            <input type="datetime-local" id="prev-inicio" required>
          </div>
          
          <div class="form-group-block">
            <label>Descripción / Observaciones:</label>
            <textarea id="prev-descripcion" placeholder="Escribe las observaciones aquí..."></textarea>
          </div>
          
          <button class="btn" id="btn-crear-preventivo" style="background-color: #007bff; color: white;">Crear Preventivo</button>
        </div>

        <!-- Formulario Emergencias -->
        <div class="card" style="border-top: 4px solid #dc3545;">
          <h3>Crear Alerta de Emergencia</h3>
          
          <div class="form-group">
            <label>Alerta:</label>
            <input type="text" id="em-titulo" placeholder="Ej: Inundación Vía Pública" required>
          </div>
          
          <div class="form-group">
            <label>Gravedad:</label>
            <select id="em-nivel">
              <option value="bajo">Bajo</option>
              <option value="medio" selected>Medio</option>
              <option value="alto">Alto</option>
              <option value="critico">Crítico</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Fecha y Hora de Inicio:</label>
            <input type="datetime-local" id="em-inicio" required>
          </div>
          
          <button class="btn btn-danger" id="btn-crear-emergencia" style="background-color: #dc3545; color: white;">🚨 Publicar Emergencia Activa</button>
        </div>
      </section>

    </main>

    <!-- BARRA DE NAVEGACIÓN INFERIOR (BOTTOM-NAV) -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-screen="perfil">Perfil</button>
      <button class="nav-btn" data-screen="operativos">Operativos</button>
      <button class="nav-btn" data-screen="preventivos">Preventivos</button>
      <button class="nav-btn" data-screen="emergencias">Emergencias</button>
      <button class="nav-btn" data-screen="admin">Admin</button>
    </nav>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
